<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Классификация риса</title>

    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js" defer></script>
</head>

<body>

    <main class="container">

        <h1>Классификация риса</h1>

        <!-- Поле вывода -->
        <textarea
            id="output"
            readonly
            placeholder="Здесь появятся результаты классификации..."
        ></textarea>

        <!-- Выбор файла -->
        <div class="upload-section">

            <label for="file-input" class="upload-button">
                Выбрать CSV-файл
            </label>

            <input
                type="file"
                id="file-input"
                accept=".csv"
            >

            <div id="file-name">
                Файл не выбран
            </div>

        </div>

        <!-- Основные кнопки -->
        <div class="buttons">

            <button
                id="classify-button"
                onclick="classifyRice()"
            >
                Начать классификацию
            </button>

            <button
                id="clear-button"
                onclick="clearResults()"
            >
                Очистить
            </button>

        </div>

        <!-- Добавление строк -->
        <div class="add-section">

            <button
                id="add-row-button"
                onclick="addRow()"
            >
                +
            </button>

            <div id="additional-rows"></div>

        </div>

    </main>

</body>
</html>
